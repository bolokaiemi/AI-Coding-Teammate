<!-- =========================================================
     PROJECT PANEL

     IMPORTANT:
     workspace.html already provides:

     <aside
         class="workspace-project-panel"
         id="workspaceProjectPanel"
     >

     Therefore this partial must NOT create another <aside>.
========================================================== -->

<div
    class="project-panel-container"
    data-project-panel
>


    <!-- =====================================================
         PROJECT PANEL HEADER
    ====================================================== -->

    <div class="project-panel-header">

        <div class="project-panel-heading">

            <span class="project-panel-label">
                PROJECT
            </span>

            <h2 id="projectPanelTitle">
                {{ project.name if project else 'My Project' }}
            </h2>

        </div>


        <button
            type="button"
            id="projectPanelOptions"
            class="panel-options-button"
            aria-label="Project options"
            title="Project options"
        >
            ⋮
        </button>

    </div>


    <!-- =====================================================
         PROJECT ACTIONS
    ====================================================== -->

    <div
        class="project-panel-actions"
        role="toolbar"
        aria-label="Project file actions"
    >


        <!-- NEW FILE -->

        <button
            type="button"
            id="newFileButton"
            class="panel-action"
            data-create-file
            title="Create a new file"
        >

            <span aria-hidden="true">
                📄
            </span>

            <span>
                New File
            </span>

        </button>


        <!-- NEW FOLDER -->

        <button
            type="button"
            id="newFolderButton"
            class="panel-action"
            data-create-folder
            title="Create a new folder"
        >

            <span aria-hidden="true">
                📁
            </span>

            <span>
                New Folder
            </span>

        </button>


        <!-- UPLOAD PROJECT FILE -->

        <button
            type="button"
            id="uploadProjectButton"
            class="panel-action"
            data-project-upload
            title="Upload project files"
        >

            <span aria-hidden="true">
                ⬆️
            </span>

            <span>
                Upload
            </span>

        </button>

    </div>


    <!-- =====================================================
         PROJECT FILE SEARCH
    ====================================================== -->

    <div class="project-file-search">

        <span
            class="project-file-search-icon"
            aria-hidden="true"
        >
            🔍
        </span>


        <label
            for="projectFileSearch"
            class="sr-only"
        >
            Search project files
        </label>


        <input
            type="search"
            id="projectFileSearch"
            placeholder="Search files..."
            autocomplete="off"
            aria-label="Search project files"
            data-file-search
        >

    </div>


    <!-- =====================================================
         FILE TREE HEADER
    ====================================================== -->

    <div class="project-file-tree-header">

        <span>
            Files
        </span>


        <button
            type="button"
            class="project-file-refresh-button"
            data-file-tree-refresh
            aria-label="Refresh project files"
            title="Refresh project files"
        >
            ↻
        </button>

    </div>


    <!-- =====================================================
         FILE TREE

         IMPORTANT:

         Do NOT manually create the individual file rows here.

         _file_tree.html owns the actual file/folder tree.

         project.js can later replace this container using:

         /workspace/file_tree
    ====================================================== -->

    <div
        id="projectFileTree"
        class="project-file-tree"
        data-file-tree
        aria-live="polite"
        aria-label="Project file tree"
    >

        {% include "workspace/_file_tree.html" %}

    </div>


    <!-- =====================================================
         PROJECT INFORMATION
    ====================================================== -->

    <div class="project-panel-footer">


        <!-- FILE COUNT -->

        <div class="project-info-row">

            <span>
                Files
            </span>

            <strong
                id="projectFileCount"
                data-project-file-count
            >
                {{ files|length if files else 0 }}
            </strong>

        </div>


        <!-- PROJECT LANGUAGE -->

        <div class="project-info-row">

            <span>
                Language
            </span>

            <strong>
                {{
                    project.language
                    if project and project.language
                    else 'Python'
                }}
            </strong>

        </div>


        <!-- AI MEMORY -->

        <div class="project-info-row">

            <span>
                AI Memory
            </span>

            <span class="memory-status">

                <span
                    class="memory-status-dot"
                    aria-hidden="true"
                >
                    ●
                </span>

                Active

            </span>

        </div>

    </div>


    <!-- =====================================================
         NEW FILE MODAL
    ====================================================== -->

    <div
        id="newFileModal"
        class="workspace-modal"
        hidden
        role="dialog"
        aria-modal="true"
        aria-labelledby="newFileModalTitle"
    >

        <div class="workspace-modal-content">


            <!-- MODAL HEADER -->

            <div class="workspace-modal-header">

                <h3 id="newFileModalTitle">
                    Create New File
                </h3>


                <button
                    type="button"
                    class="modal-close"
                    data-close-modal="newFileModal"
                    aria-label="Close new file dialog"
                >
                    ✕
                </button>

            </div>


            <!-- NEW FILE FORM -->

            <form
                id="newFileForm"
                data-new-file-form
            >

                <div class="form-group">

                    <label for="newFileName">
                        File Name
                    </label>


                    <input
                        type="text"
                        id="newFileName"
                        name="file_name"
                        placeholder="example.py"
                        autocomplete="off"
                        required
                    >

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="modal-secondary-button"
                        data-close-modal="newFileModal"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        class="modal-primary-button"
                    >
                        Create File
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =====================================================
         NEW FOLDER MODAL
    ====================================================== -->

    <div
        id="newFolderModal"
        class="workspace-modal"
        hidden
        role="dialog"
        aria-modal="true"
        aria-labelledby="newFolderModalTitle"
    >

        <div class="workspace-modal-content">


            <!-- MODAL HEADER -->

            <div class="workspace-modal-header">

                <h3 id="newFolderModalTitle">
                    Create New Folder
                </h3>


                <button
                    type="button"
                    class="modal-close"
                    data-close-modal="newFolderModal"
                    aria-label="Close new folder dialog"
                >
                    ✕
                </button>

            </div>


            <!-- NEW FOLDER FORM -->

            <form
                id="newFolderForm"
                data-new-folder-form
            >

                <div class="form-group">

                    <label for="newFolderName">
                        Folder Name
                    </label>


                    <input
                        type="text"
                        id="newFolderName"
                        name="folder_name"
                        placeholder="templates"
                        autocomplete="off"
                        required
                    >

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="modal-secondary-button"
                        data-close-modal="newFolderModal"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        class="modal-primary-button"
                    >
                        Create Folder
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =====================================================
         PROJECT FILE UPLOAD INPUT

         This input is specifically for source/project files.

         It is different from mediaUploadInput in workspace.html,
         which handles screenshots, images and videos for the AI.
    ====================================================== -->

    <input
        type="file"
        id="projectUploadInput"
        data-project-upload-input
        hidden
        multiple
        accept="
            .py,
            .js,
            .ts,
            .html,
            .css,
            .json,
            .sql,
            .md,
            .txt,
            .java,
            .cpp,
            .c,
            .h,
            .hpp,
            .go,
            .rs,
            .php,
            .rb,
            .sh,
            .yaml,
            .yml,
            .xml,
            .toml,
            .ini
        "
    >

</div>
